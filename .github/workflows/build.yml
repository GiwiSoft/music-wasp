name: ci

on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:
  workflow_dispatch:

# Superseded pushes no longer finish their full test/build cycle.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Main-branch pushes and pull requests run the test suite. No production
  # secrets are exposed here, so fork pull requests work normally.
  test:
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
          - os: windows-latest
            name: windows

    runs-on: ${{ matrix.os }}
    name: ${{ matrix.name }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux audio dev headers
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev pkg-config libxkbcommon-dev \
            mesa-vulkan-drivers libegl-mesa0

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          # Keep the cache from a failing run so iterating on a fix reuses it.
          cache-on-failure: true

      - name: Test
        run: cargo test --workspace --locked

  # Tag pushes skip tests (main already passed) and build the release archives.
  # The production environment supplies the AcoustID application key that the
  # core build script bakes into the binary.
  build-release:
    if: startsWith(github.ref, 'refs/tags/')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
          - os: windows-latest
            name: windows
          - os: macos-latest
            name: macos-arm64
            arch: arm64
          - os: macos-26-intel
            name: macos-x86_64
            arch: x86_64

    runs-on: ${{ matrix.os }}
    name: ${{ matrix.name }}
    environment: production
    env:
      ACCOUSTID_APIKEY: ${{ secrets.ACCOUSTID_APIKEY }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux audio dev headers
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev pkg-config libxkbcommon-dev \
            mesa-vulkan-drivers libegl-mesa0

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Build release
        run: cargo build --release --workspace --locked

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist
          tar -czf "dist/musicwasp-${GITHUB_REF_NAME}-linux-x86_64.tar.gz" \
            --transform "s,^,musicwasp-${GITHUB_REF_NAME}/," \
            -C target/release musicwasp musicwasp-cli \
            -C "$GITHUB_WORKSPACE" LICENSE README.md \
              packaging/musicwasp.desktop \
              assets/ic_launcher-web.png \
              assets/skins.json \
              assets/i18n \
              scripts/install-desktop.sh

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive `
            -Path target/release/musicwasp.exe,target/release/musicwasp-cli.exe,LICENSE,README.md,assets/musicwasp.ico,assets/skins.json,assets/i18n `
            -DestinationPath "dist/musicwasp-$env:GITHUB_REF_NAME-windows-x86_64.zip"

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist
          stage="$RUNNER_TEMP/musicwasp-${GITHUB_REF_NAME}"
          mkdir -p "$stage/assets/i18n"
          cp target/release/musicwasp target/release/musicwasp-cli "$stage/"
          cp LICENSE README.md "$stage/"
          cp assets/ic_launcher-web.png assets/skins.json "$stage/assets/"
          cp assets/i18n/*.json "$stage/assets/i18n/"
          tar -czf "dist/musicwasp-${GITHUB_REF_NAME}-macos-${{ matrix.arch }}.tar.gz" \
            -C "$RUNNER_TEMP" "musicwasp-${GITHUB_REF_NAME}"

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: musicwasp-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  # Publishes the archives with release notes generated by GitHub from the
  # commits and pull requests since the last tag.
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build-release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Verify downloaded artifacts
        run: |
          ls -l dist
          test -n "$(find dist -maxdepth 1 -name '*-linux-x86_64.tar.gz' -print -quit)"
          test -n "$(find dist -maxdepth 1 -name '*-windows-x86_64.zip' -print -quit)"
          test -n "$(find dist -maxdepth 1 -name '*-macos-arm64.tar.gz' -print -quit)"
          test -n "$(find dist -maxdepth 1 -name '*-macos-x86_64.tar.gz' -print -quit)"
          tar -tzf dist/*-linux-x86_64.tar.gz | grep -q 'assets/ic_launcher-web.png'
          tar -tzf dist/*-linux-x86_64.tar.gz | grep -q 'assets/skins.json'
          tar -tzf dist/*-linux-x86_64.tar.gz | grep -q 'assets/i18n/fr.json'
          unzip -l dist/*-windows-x86_64.zip | grep -q 'musicwasp.ico'
          unzip -l dist/*-windows-x86_64.zip | grep -q 'skins.json'
          unzip -l dist/*-windows-x86_64.zip | grep -q 'fr.json'
          tar -tzf dist/*-macos-arm64.tar.gz | grep -q '/musicwasp$'
          tar -tzf dist/*-macos-arm64.tar.gz | grep -q '/musicwasp-cli$'
          tar -tzf dist/*-macos-arm64.tar.gz | grep -q 'assets/skins.json'
          tar -tzf dist/*-macos-x86_64.tar.gz | grep -q '/musicwasp$'
          tar -tzf dist/*-macos-x86_64.tar.gz | grep -q '/musicwasp-cli$'
          tar -tzf dist/*-macos-x86_64.tar.gz | grep -q 'assets/i18n/fr.json'

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: MusicWasp ${{ github.ref_name }}
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Fail the job if the tag/release exists but the archives are not attached.
      - name: Verify release assets are attached
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          assets=$(gh release view "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --json assets \
            --jq '.assets[].name')
          echo "$assets"
          test -n "$(printf '%s\n' "$assets" | grep 'linux-x86_64.tar.gz')" || {
            echo "Linux archive is not attached to the release" >&2
            exit 1
          }
          test -n "$(printf '%s\n' "$assets" | grep 'windows-x86_64.zip')" || {
            echo "Windows archive is not attached to the release" >&2
            exit 1
          }
          test -n "$(printf '%s\n' "$assets" | grep 'macos-arm64.tar.gz')" || {
            echo "macOS arm64 archive is not attached to the release" >&2
            exit 1
          }
          test -n "$(printf '%s\n' "$assets" | grep 'macos-x86_64.tar.gz')" || {
            echo "macOS x86_64 archive is not attached to the release" >&2
            exit 1
          }
