[package]
name = "musicwasp-gui"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "musicwasp"
path = "src/main.rs"
# Integration tests drive the library directly; do not link a second copy of
# the GUI as an empty unit-test binary.
test = false
bench = false

[lib]
name = "musicwasp_gui"
path = "src/lib.rs"

[dependencies]
egui_phosphor_icons = "0.5"
musicwasp-core = { path = "../core" }
anyhow.workspace = true
dirs.workspace = true
lactea = "0.2.2"
eframe = { version = "0.36", default-features = false, features = [
    "default_fonts",
    "wgpu",
    "wayland",
    "x11",
    "__screenshot",
] }
egui = "0.36"
egui_extras = "0.36"
serde.workspace = true
serde_json.workspace = true
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp"] }
notify = "6.1"

[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3", features = ["blocking"] }
mpris-server = { version = "0.11", features = ["tokio"] }
tokio = { version = "1", features = ["rt", "sync", "time", "net"] }

[build-dependencies]
winresource = "0.1"

[dev-dependencies]
tempfile = "3"
pollster = "0.4"
toml = "0.8"
egui_kittest = { version = "0.36", features = ["eframe"] }

# Snapshot rendering pulls wgpu, which is only used by the Linux snapshot test.
# Keeping it target-specific stops Windows test builds from compiling wgpu.
[target.'cfg(target_os = "linux")'.dev-dependencies]
egui_kittest = { version = "0.36", features = ["eframe", "snapshot", "wgpu"] }
