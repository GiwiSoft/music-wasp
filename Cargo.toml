[workspace]
resolver = "2"
members = ["core", "cli", "gui"]

[workspace.package]
version = "0.6.0"
edition = "2021"
license = "GPL-3.0-only"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lofty = "0.21"
walkdir = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
dirs = "5"
tracing = "0.1"
tracing-subscriber = "0.3"

[profile.release]
opt-level = 3
lto = "thin"
strip = true

# Full debuginfo makes the GUI and every test binary enormous and slow to
# link. Line tables are enough for backtraces during development.
[profile.dev]
debug = 1

[profile.test]
debug = 1

# Temporary native-Wayland drag-and-drop support.
# winit 0.30 has no Wayland file drops. This is the reviewed 0.30 backport
# (rust-windowing/winit#4729). The egui-winit patch uses winit's data device
# clipboard so Hyprland does not serve the selection to a second data device.
# Remove both once winit and egui-winit release these changes.
[patch.crates-io]
winit = { git = "https://github.com/crmne/winit", rev = "7a962fd46470a137d9a7a1945bf5b5d0b95a002c" }
egui-winit = { path = "patches/egui-winit" }
