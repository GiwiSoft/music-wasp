[package]
name = "musicwasp-gui"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "musicwasp"
path = "src/main.rs"

[lib]
name = "musicwasp_gui"
path = "src/lib.rs"

[dependencies]
egui_phosphor_icons = "0.5"
musicwasp-core = { path = "../core" }
anyhow.workspace = true
dirs.workspace = true
eframe = { version = "0.36", default-features = false, features = [
    "default_fonts",
    "glow",
    "wayland",
    "x11",
    "__screenshot",
] }
egui = "0.36"
egui_extras = "0.36"
serde.workspace = true
serde_json.workspace = true
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
notify = "6.1"

[target.'cfg(target_os = "linux")'.dependencies]
mpris-server = { version = "0.11", features = ["tokio"] }
tokio = { version = "1", features = ["rt", "sync", "time", "net"] }

[build-dependencies]
winresource = "0.1"

[dev-dependencies]
tempfile = "3"
egui_kittest = { version = "0.36", features = ["eframe"] }
