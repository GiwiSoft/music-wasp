name: ci

on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:
  workflow_dispatch:

jobs:
  # Every push and pull request runs the test suite. Packages are built only
  # when a tag is pushed, so normal commits stay quick.
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
          - os: windows-latest
            name: windows

    runs-on: ${{ matrix.os }}
    name: ${{ matrix.name }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux audio dev headers
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev pkg-config libxkbcommon-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --workspace

      - name: Build release
        if: startsWith(github.ref, 'refs/tags/')
        run: cargo build --release --workspace

      - name: Package (Linux)
        if: startsWith(github.ref, 'refs/tags/') && runner.os == 'Linux'
        run: |
          mkdir -p dist
          tar -czf "dist/musicwasp-${GITHUB_REF_NAME}-linux-x86_64.tar.gz" \
            -C target/release musicwasp musicwasp-cli \
            -C "$GITHUB_WORKSPACE" LICENSE README.md

      - name: Package (Windows)
        if: startsWith(github.ref, 'refs/tags/') && runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive `
            -Path target/release/musicwasp.exe,target/release/musicwasp-cli.exe,LICENSE,README.md `
            -DestinationPath "dist/musicwasp-$env:GITHUB_REF_NAME-windows-x86_64.zip"

      - name: Upload release artifacts
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: musicwasp-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  # A tag runs the tests above, then publishes the archives with release notes
  # generated by GitHub from the commits and pull requests since the last tag.
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Verify downloaded artifacts
        run: |
          ls -l dist
          test -n "$(find dist -maxdepth 1 -name '*-linux-x86_64.tar.gz' -print -quit)"
          test -n "$(find dist -maxdepth 1 -name '*-windows-x86_64.zip' -print -quit)"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: MusicWasp ${{ github.ref_name }}
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Fail the job if the tag/release exists but the archives are not attached.
      - name: Verify release assets are attached
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          assets=$(gh release view "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --json assets \
            --jq '.assets[].name')
          echo "$assets"
          test -n "$(printf '%s\n' "$assets" | grep 'linux-x86_64.tar.gz')" || {
            echo "Linux archive is not attached to the release" >&2
            exit 1
          }
          test -n "$(printf '%s\n' "$assets" | grep 'windows-x86_64.zip')" || {
            echo "Windows archive is not attached to the release" >&2
            exit 1
          }
